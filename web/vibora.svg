<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title">
  <title id="title">VIBORA viper</title>
  <rect width="64" height="64" rx="15" fill="#d8ec6d"/>
  <!-- S-shaped body, tapering into the tail -->
  <path d="M38 19 C 25 18, 17 23, 21 30.5 C 25 38, 44 35.5, 44.5 43.5 C 45 51.5, 31 55, 17 51" fill="none" stroke="#1f4d3f" stroke-width="7.5" stroke-linecap="round"/>
  <path d="M17 51 C 13 50, 10 48, 8.5 45" fill="none" stroke="#1f4d3f" stroke-width="3.6" stroke-linecap="round"/>
  <!-- Diamond markings along the back -->
  <path d="M38 19 C 25 18, 17 23, 21 30.5 C 25 38, 44 35.5, 44.5 43.5 C 45 51.5, 31 55, 19 51.5" fill="none" stroke="#d8ec6d" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="0.1 5.4"/>
  <!-- Triangular viper head -->
  <path d="M35.5 11.5 L50.5 16.2 Q54.2 18.5 50.5 20.8 L35.5 25.5 Q30.8 18.5 35.5 11.5 Z" fill="#1f4d3f"/>
  <ellipse cx="43" cy="16.6" rx="2.2" ry="1.9" fill="#d8ec6d"/>
  <rect x="42.55" y="15" width="0.9" height="3.2" rx="0.45" fill="#1f4d3f"/>
  <!-- Forked tongue -->
  <path d="M53.5 18.5 H58.5 M58.5 18.5 L61 16.4 M58.5 18.5 L61 20.6" fill="none" stroke="#c2453b" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
